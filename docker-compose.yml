services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: voiceagent
    # 55432, not 5432: a native PostgreSQL install commonly already owns 5432 on
    # a developer machine, and the collision presents as "password
    # authentication failed for user agent" rather than as a port conflict,
    # because the host resolves localhost to the other server.
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # Media transport for the browser demo. --dev is a real LiveKit server with
  # the well-known credentials devkey/secret baked in, so nothing has to be
  # provisioned to talk to the agent from a laptop.
  #
  # It is dev-only in the literal sense: those credentials are published in
  # LiveKit's own docs, so anyone who can reach the port can mint a token.
  # Never expose 7880 beyond localhost, and never reuse these values anywhere
  # a real caller could reach.
  livekit:
    image: livekit/livekit-server:latest
    # --node-ip is not optional here. Without it LiveKit advertises the address
    # it sees on itself, which inside Docker is the bridge IP (172.x.x.x). The
    # browser is on the host and cannot route there, so signalling succeeds,
    # the participant joins, and then ICE fails and the call drops with
    # CONNECTION_TIMEOUT — a failure that looks like a credentials problem and
    # is not one. Pinning it to loopback makes the browser send media to the
    # published port instead.
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "127.0.0.1:7880:7880"       # signalling (WebSocket)
      - "127.0.0.1:7881:7881"       # ICE-TCP media fallback
      - "127.0.0.1:7882:7882/udp"   # RTC media. Omit it and every call
                                    # silently degrades to the TCP fallback,
                                    # which adds jitter to a latency demo.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
