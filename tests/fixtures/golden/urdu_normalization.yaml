# Golden expectations for Urdu number/date/time normalisation.
#
# ⚠️  NEEDS NATIVE-SPEAKER REVIEW BEFORE IT IS TRUSTED.
#
# The automated tests confirm STABILITY, not CORRECTNESS. They lock in whatever
# is written here — including mistakes. Until a native Urdu speaker has read
# this file and signed off, treat every expectation as a guess by a non-speaker.
#
# Review checklist for whoever signs off:
#   1. Are the 0-99 numerals right? (agent/language/numbers.py) Urdu numerals are
#      irregular; 21 = اکیس is not a compound of بیس and ایک.
#   2. Is the colloquial hundreds form right? Is 1500 "پندرہ سو" in speech?
#   3. Are the half-forms idiomatic? ڈیڑھ / ڈھائی / ساڑھے تین, not اعشاریہ.
#   4. Do the time expressions sound natural on a phone call?
#   5. Is لاکھ / کروڑ grouping what a Karachi caller expects?
#
# Review sheet with audio for every case below:
#   https://claude.ai/code/artifact/51bd8b30-5134-4ce3-b374-808fedb8bcc6
#   (regenerate with: uv run python eval/make_review_sheet.py)
#
reviewed_by: Basil
reviewed_date: 2026-08-09

# Reviewed by ear against Azure ur-PK audio, not by reading. 22 of 24 cases
# approved. The two rejections are recorded under `open_issues` below and are
# tracked as real defects, not as review noise.

# The 0-99 table was diffed against an independent reference first: 94/100
# agreed. Six spellings were contested; the reviewer resolved five.
contested_numerals:
  - n: 51
    ours: اکاون
    alternative: اکیاون
    resolution: kept        # اکاون confirmed
  - n: 64
    ours: چونسٹھ
    alternative: چوسٹھ
    resolution: UNRESOLVED  # reviewer rejected BOTH; correct form still needed
  - n: 68
    ours: اڑسٹھ
    alternative: اٹھسٹھ
    resolution: kept
  - n: 75
    ours: پچھتر
    alternative: پچہتر
    resolution: changed     # was پچہتر, reviewer chose پچھتر
  - n: 91
    ours: اکانوے
    alternative: اکیانوے
    resolution: kept
  - n: 92
    ours: بانوے
    alternative: بیانوے
    resolution: kept

# Rejected in review. Both stay here until fixed and re-reviewed.
open_issues:
  - case: g14
    input: "1.5"
    produced: ڈیڑھ
    verdict: rejected
    detail: null            # reviewer gave no note; needs the correct wording
    status: awaiting detail

  - case: g22
    input: آپ کا order کل آئے گا
    produced: آپ کا order کل آئے گا
    verdict: rejected
    detail: "order pronunciation is not correct"
    status: not a normaliser bug
    analysis: >
      The text is right - "order" is preserved in Latin exactly as the
      code-switching design intends. What is wrong is that the Azure ur-PK
      voice mispronounces the English word. This is a TTS-layer defect and it
      matters: the entire product premise is Urdu speech with English nouns
      left in English. Tracked against TASK-05/TASK-08, not TASK-06.

cases:
  # ── plain integers ────────────────────────────────────────────────────
  - input: "0"
    expected: "صفر"
    note: zero
  - input: "7"
    expected: "سات"
    note: single digit
  - input: "21"
    expected: "اکیس"
    note: irregular - not a compound of بیس and ایک
  - input: "48"
    expected: "اڑتالیس"
    note: irregular forties
  - input: "99"
    expected: "ننانوے"
    note: top of the lookup table
  - input: "100"
    expected: "ایک سو"
    note: first scale

  # ── South Asian grouping ──────────────────────────────────────────────
  - input: "1500"
    expected: "پندرہ سو"
    note: colloquial hundreds form, not ایک ہزار پانچ سو
  - input: "3000"
    expected: "تین ہزار"
    note: round thousand keeps the ہزار form
  - input: "100000"
    expected: "ایک لاکھ"
    note: lakh, NOT one hundred thousand
  - input: "250000"
    expected: "دو لاکھ پچاس ہزار"
    note: lakh with remainder
  - input: "10000000"
    expected: "ایک کروڑ"
    note: crore

  # ── currency ───────────────────────────────────────────────────────────
  - input: "Rs. 1,500"
    expected: "پندرہ سو روپے"
    note: comma separator stripped
  - input: "PKR 250"
    expected: "دو سو پچاس روپے"
    note: PKR prefix

  # ── percentages and decimals ───────────────────────────────────────────
  - input: "50%"
    expected: "پچاس فیصد"
    note: percentage
  - input: "1.5"
    expected: "ڈیڑھ"
    note: idiomatic half, not ایک اعشاریہ پانچ
  - input: "2.5"
    expected: "ڈھائی"
    note: idiomatic half
  - input: "3.5"
    expected: "ساڑھے تین"
    note: idiomatic half from three upward

  # ── dates and times ────────────────────────────────────────────────────
  - input: "2026-08-08"
    expected: "آٹھ اگست دو ہزار چھبیس"
    note: must be consumed before the integer rule shreds it
  - input: "09:00"
    expected: "صبح نو بجے"
    note: morning
  - input: "14:30"
    expected: "دوپہر ڈھائی بجے"
    note: half past two uses ڈھائی
  - input: "13:15"
    expected: "دوپہر سوا ایک بجے"
    note: quarter past
  - input: "20:45"
    expected: "رات پونے نو بجے"
    note: quarter to nine at night

  # ── code-switching ─────────────────────────────────────────────────────
  # Revised after the g22 review: English nouns are spoken in Urdu script.
  # The ur-PK voice mispronounces Latin-script English; writing the word the
  # way an Urdu speaker writes it gives a natural Pakistani pronunciation.
  # This is the TTS input only - history and transcripts keep the Latin form.
  - input: "آپ کا order کل آئے گا"
    expected: "آپ کا آرڈر کل آئے گا"
    note: order -> آرڈر for correct pronunciation (was the g22 defect)
  - input: "آپ کا balance 2500 روپے ہے"
    expected: "آپ کا بیلنس دو ہزار پانچ سو روپے ہے"
    note: English transliterated, number converted
  - input: "میں tracking check کر کے بتاتا ہوں"
    expected: "میں ٹریکنگ چیک کر کے بتاتا ہوں"
    note: two English verbs in one Urdu clause
  - input: "Premium Plan میں unlimited data ہے"
    expected: "پریمیم پلان میں ان لمیٹڈ data ہے"
    note: >
      Product name transliterated, but "data" deliberately stays in Latin -
      round 4 review asked for English pronunciation of that word, and the SSML
      layer switches language for any Latin run.
  - input: "آپ کا data ختم ہو گیا ہے"
    expected: "آپ کا data ختم ہو گیا ہے"
    note: English-pronunciation word survives untouched for the SSML switch
  - input: "میں آپ کو call کروں گا"
    expected: "میں آپ کو call کروں گا"
    note: call stays Latin (round 4)
