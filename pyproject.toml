[project]
name = "ai-voice-agent"
version = "0.1.0"
description = "Production Urdu/English voice agent for Pakistani customers"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "livekit-agents[anthropic,azure,deepgram,silero]~=1.0",
    "anthropic>=0.40",
    "deepgram-sdk>=3.7",
    "azure-cognitiveservices-speech>=1.41",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "redis>=5.2",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "openai>=2.53.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.119",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

# ── Lint ────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "ASYNC", # blocking calls inside async functions — the hot-path guard
    "B",     # bugbear
    "UP",    # pyupgrade
    "RUF",
]

# RUF001 flags Urdu punctuation as "ambiguous" and suggests ASCII replacements.
# Taking that advice would be a product bug, not a style fix: U+06D4 is what the
# sentence chunker splits on, and swapping it for "." or "-" silently stops
# streaming TTS from ever firing on Urdu text. These characters are deliberate.
allowed-confusables = [
    "۔", # U+06D4 ARABIC FULL STOP     - sentence boundary for the chunker
    "،", # U+060C ARABIC COMMA
    "؟", # U+061F ARABIC QUESTION MARK - also a chunker boundary
    "؛", # U+061B ARABIC SEMICOLON
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC"] # fakes sleep deliberately to simulate provider latency

# ── Types ───────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["livekit.*", "deepgram.*", "azure.*", "pgvector.*", "asyncpg.*"]
ignore_missing_imports = true

# ── Tests ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: hits real vendor APIs (costs money, needs keys)",
    "latency: asserts against the latency budget",
]
